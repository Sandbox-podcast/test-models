 <text x="40" y="632" font-size="17" font-weight="700">Repères Three.js</text>
 <text x="40" y="660" font-size="15" fill="#b2c1cc">Origine au coin supérieur gauche du quadrillage. X vers la droite, Z vers le bas, Y vers le haut.</text>
 <text x="40" y="685" font-size="15" fill="#b2c1cc">Un carreau = 10 m. Le pointillé ambre indique la liaison à pied entre la cour et la voiture.</text>
 <text x="40" y="725" font-size="15" fill="#b2c1cc">Volumes bâtis en gris · passages à maintenir libres · tracé fictif inspiré de gare–L’Houmeau.</text>
</g>
