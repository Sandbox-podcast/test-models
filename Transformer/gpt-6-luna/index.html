// doors become arms; same gold striped panels

for(const side of [-1,1]){const lamp=box(chassis,'headlight',[.34,.16,.08],glow,[side*.67,.79,1.93],.035);const tail=box(chassis,'taillight',[.38,.14,.07],red,[side*.62,.78,-1.94],.025)}box(chassis,'bumper',[1.82,.14,.18],silver,[0,.39,1.96],.03);box(chassis,'rear bumper',[1.82,.14,.16],silver,[0,.39,-1.95],.03);
// Transform position and orientation, exact segment clock 1.5-3.5 and 7-9
const duration=12, transitions=[{start:1.5,end:3.5,from:0,to:1},{start:7,end:9,from:1,to:0}];let elapsed=0,playing=true,speed=1,last=performance.now()/1000,manualPose=null;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};const pulse=(t,a,b)=>smooth((t-a)/(b-a));

function baseParts(amount){for(const p of Object.values(parts)){p.g.position.lerpVectors(p.carPos,p.botPos,amount);p.g.quaternion.copy(p.carQ).slerp(p.botQ,amount)}

const tempQ=new THREE.Quaternion();function animatePose(t){let amount=manualPose===null?transformAmount(t):manualPose;baseParts(amount);root.position.set(0,0,0);root.rotation.set(0,0,0);
// car ride-back travel after second transform; starts from walking endpoint (forward +Z)
if(t>=4&&t<7){const u=(t-4)/3;root.position.z=1.55*u;root.rotation.y=.025*Math.sin(u*Math.PI)}if(t>=7&&t<9){root.position.z=1.55*pulse(t,7,9)}if(t>=9&&t<11){const u=pulse(t,9,11);root.position.z=1.55*(1-u)}
// walking gait while in robot shape, with planted feet over alternating stance
const walk= t>=4&&t<7?1:0;const phase=(t-4)*Math.PI*1.7;for(const side of [-1,1]){const s=side<0?'L':'R',leg=limbs['leg'+s],arm=limbs['arm'+s];const ph=phase+(side>0?Math.PI:0);const stride=Math.sin(ph),lift=Math.max(0,Math.cos(ph))*.18;

}
const scrub=document.querySelector('#scrub'),nowEl=document.querySelector('#now'),stateEl=document.querySelector('#state'),playBtn=document.querySelector('#play');function setTime(t){elapsed=((t%12)+12)%12;scrub.value=elapsed;nowEl.textContent=elapsed.toFixed(2).padStart(5,'0');manualPose=null;animatePose(elapsed)}function poseCar(){playing=false;manualPose=0;playBtn.innerHTML='▶ &nbsp; Lecture';animatePose(elapsed)}function poseRobot(){playing=false;manualPose=1;playBtn.innerHTML='▶ &nbsp; Lecture';animatePose(elapsed)}scrub.addEventListener('input',()=>{playing=false;playBtn.innerHTML='▶ &nbsp; Lecture';setTime(+scrub.value)});playBtn.onclick=()=>{playing=!playing;manualPose=null;playBtn.innerHTML=playing?'Ⅱ &nbsp; Pause':'▶ &nbsp; Lecture';last=performance.now()/1000};document.querySelector('#restart').onclick=()=>{setTime(0);playing=true;playBtn.innerHTML='Ⅱ &nbsp; Pause';last=performance.now()/1000};document.querySelector('#speed').onchange=e=>speed=+e.target.value;document.querySelector('#carKey').onclick=poseCar;document.querySelector('#robotKey').onclick=poseRobot;document.querySelector('#home').onclick=()=>{camera.position.copy(homePos);controls.target.set(0,1.2,0);controls.update()};addEventListener('keydown',e=>{if(e.key==='1')poseCar();if(e.key==='2')poseRobot();if(e.code==='Space'){e.preventDefault();playBtn.click()}});

function frame(){requestAnimationFrame(frame);const n=performance.now()/1000,dt=Math.min(.05,n-last);last=n;if(playing){elapsed+=dt*speed;if(elapsed>=12)elapsed%=12;scrub.value=elapsed;nowEl.textContent=elapsed.toFixed(2).padStart(5,'0');manualPose=null;animatePose(elapsed)}updateState();controls.update();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
