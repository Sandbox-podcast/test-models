<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muscle car ⇄ robot — démo de transformation</title>
<style>
  :root { --yellow:#FFC400; --ink:#e9ebee; --glass:rgba(18,20,24,.72); --line:rgba(255,255,255,.12); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#1b1d21; overflow:hidden; font-family:"Inter","Segoe UI",system-ui,sans-serif; color:var(--ink); }
  #stage { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; outline:none; cursor:grab; }
  canvas:active { cursor:grabbing; }
  .vignette { position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }
  #title { position:fixed; left:22px; top:18px; font-size:12px; letter-spacing:.18em; text-transform:uppercase; opacity:.7; pointer-events:none; }
  #title b { color:var(--yellow); font-weight:600; }
  #phase { position:fixed; right:22px; top:18px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.8; pointer-events:none; font-variant-numeric:tabular-nums; }
  #bar { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:10px;
    padding:8px 12px; background:var(--glass); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(10px);
    width:min(940px, calc(100vw - 24px)); }
  button { font:inherit; font-size:12px; color:var(--ink); background:rgba(255,255,255,.06); border:1px solid var(--line);
    border-radius:9px; padding:7px 11px; cursor:pointer; white-space:nowrap; transition:background .15s, border-color .15s, color .15s; }
  button:hover { background:rgba(255,255,255,.14); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--yellow); outline-offset:2px; }
  button.on { background:var(--yellow); color:#15171a; border-color:var(--yellow); font-weight:600; }
  .grp { display:flex; gap:4px; }
  .sep { width:1px; align-self:stretch; background:var(--line); }
  #play { width:38px; padding:7px 0; font-size:14px; }
  #time { flex:1; min-width:120px; accent-color:var(--yellow); height:20px; }
  #tlabel { font-size:12px; min-width:92px; text-align:right; font-variant-numeric:tabular-nums; opacity:.85; }
  @media (max-width:760px){ #bar{flex-wrap:wrap; justify-content:center;} #time{order:9; flex-basis:100%;} }
</style>
</head>
<body>
<div id="stage"></div>
<div class="vignette"></div>
<div id="title"><b>Muscle car</b> ⇄ robot · boucle 12 s</div>
<div id="phase"></div>

<div id="bar" role="group" aria-label="Contrôles">
  <button id="play" title="Lecture / pause (Espace)" aria-label="Lecture / pause">⏸</button>
  <button id="restart" title="Recommencer (R)">↺ Recommencer</button>
  <div class="sep"></div>
  <div class="grp" role="group" aria-label="Vitesse">
    <button id="s1" class="on" title="Vitesse normale">1×</button>
    <button id="s025" title="Ralenti pour inspecter la mécanique">0,25×</button>
  </div>
  <div class="sep"></div>
  <input id="time" type="range" min="0" max="12" step="0.001" value="0" aria-label="Temps (secondes)">
  <span id="tlabel">0,00 / 12 s</span>
  <div class="sep"></div>
  <div class="grp" role="group" aria-label="Formes">
    <button id="bcar" title="Figer la forme voiture (V)">Voiture</button>
    <button id="brobot" title="Figer la forme robot (B)">Robot</button>
  </div>
  <button id="bcam" title="Retrouver le cadrage initial (C)">⌖ Cadrage</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   Constantes & utilitaires
   ============================================================ */
const D2R = Math.PI / 180;
const LOOP = 12;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sstep = x => { x = clamp(x); return x * x * (3 - 2 * x); };

// Fonctions d'accélération/décélération brèves (mouvements francs)
const E = {
  io:  t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  ob:  t => { const c1 = 1.1, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }, // verrouillage avec léger "clac"
  oq:  t => 1 - Math.pow(1 - t, 4),
};

const WHEEL_R = 0.435;
const D = 3 * (2 * Math.PI / 5) * WHEEL_R;   // distance de marche (multiple du pas des 5 branches de jante → boucle sans saut)
const A = D / 2;                              // longueur de pas de base
const L1 = 1.15, L2 = 1.15;                   // cuisse, tibia
const ANKLE_H = 0.545;                        // hauteur de l'axe de cheville quand le pied est à plat
const STAND_HIP = ANKLE_H + L1 + L2 - 0.0005; // hanche : jambes tendues
const HIP_CAR_Y = 0.595;                      // axe commun hanche / genou / cheville (repère voiture)

/* ============================================================
   Scène, rendu, lumières
   ============================================================ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c20);
scene.fog = new THREE.Fog(0x1a1c20, 26, 60);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;   // généré par code, aucune image
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(32, 16 / 9, 0.1, 120);
const HOME_POS = new THREE.Vector3(8.1, 4.4, 12.3);
const HOME_TGT = new THREE.Vector3(0, 2.45, 0.7);
camera.position.copy(HOME_POS);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 5; controls.maxDistance = 32;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

const key = new THREE.DirectionalLight(0xffffff, 2.8);
key.position.set(6, 11, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03; key.shadow.radius = 4;
key.target.position.set(0, 0, 0.8);
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0xffffff, 0.7); fill.position.set(-8, 4, 6); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.4); rim.position.set(-3, 6, -9); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3d42, 0.35));

// Sol anthracite
const floor = new THREE.Mesh(new THREE.CircleGeometry(60, 96),
  new THREE.MeshStandardMaterial({ color: 0x2a2d32, roughness: 0.82, metalness: 0.05 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const ring = new THREE.Mesh(new THREE.RingGeometry(7.4, 7.44, 160), new THREE.MeshBasicMaterial({ color: 0x40444b }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.002; scene.add(ring);
const grid = new THREE.GridHelper(120, 120, 0x34383e, 0x2f3238);
grid.position.y = 0.001; grid.material.transparent = true; grid.material.opacity = 0.35; scene.add(grid);

/* ============================================================
   Matériaux (un seul jaune pour tous les panneaux peints)
   ============================================================ */
const M = {
  yellow: new THREE.MeshPhysicalMaterial({ color: 0xFFC400, metalness: 0.22, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.07 }),
  black:  new THREE.MeshPhysicalMaterial({ color: 0x08080a, metalness: 0.1, roughness: 0.35, clearcoat: 0.8, clearcoatRoughness: 0.1 }),
  tire:   new THREE.MeshStandardMaterial({ color: 0x0c0c0e, roughness: 0.92, metalness: 0 }),
  rim:    new THREE.MeshStandardMaterial({ color: 0xcfd3d9, roughness: 0.22, metalness: 1 }),
  dark:   new THREE.MeshStandardMaterial({ color: 0x3b3f46, roughness: 0.42, metalness: 0.85 }),
  darker: new THREE.MeshStandardMaterial({ color: 0x23262b, roughness: 0.5, metalness: 0.8 }),
  glass:  new THREE.MeshPhysicalMaterial({ color: 0x0b0e12, roughness: 0.05, metalness: 0.2, clearcoat: 1, clearcoatRoughness: 0.03 }),
  eye:    new THREE.MeshStandardMaterial({ color: 0xaee6ff, emissive: 0x7fd4ff, emissiveIntensity: 2.6, roughness: 0.3 }),
  lamp:   new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xf4f8ff, emissiveIntensity: 1.2, roughness: 0.2 }),
  tail:   new THREE.MeshStandardMaterial({ color: 0x5a0a0a, emissive: 0xff2a1a, emissiveIntensity: 1.0, roughness: 0.3 }),
};
const Y = M.yellow, K = M.black, DK = M.dark, DD = M.darker, GL = M.glass;

/* ============================================================
   Aides de modélisation — tout est modélisé en repère « voiture »
   (x droite, y haut, z avant), puis chaque pièce est rattachée à
   un nœud articulé dont le pivot est exprimé dans ce même repère.
   ============================================================ */
function shadowed(m) { m.castShadow = true; m.receiveShadow = true; return m; }
function box(w, h, d, mat, x, y, z, r = 0.025) {
  const rr = Math.min(r, w * 0.49, h * 0.49, d * 0.49);
  const m = shadowed(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, rr), mat));
  m.position.set(x, y, z); return m;
}
function cyl(r, len, axis, mat, x, y, z, seg = 28) {
  const g = new THREE.CylinderGeometry(r, r, len, seg);
  if (axis === 'x') g.rotateZ(Math.PI / 2); else if (axis === 'z') g.rotateX(Math.PI / 2);
  const m = shadowed(new THREE.Mesh(g, mat)); m.position.set(x, y, z); return m;
}
// Panneau latéral extrudé avec arche de roue (plan z/y, épaisseur selon x)
function archPlate(zMin, zMax, yMin, yMax, cz, cy, r, xc, t) {
  const dy = yMin - cy, dx = Math.sqrt(r * r - dy * dy), a0 = Math.atan2(dy, dx);
  const sh = new THREE.Shape();
  sh.moveTo(zMin, yMin); sh.lineTo(zMin, yMax); sh.lineTo(zMax, yMax); sh.lineTo(zMax, yMin);
  sh.lineTo(cz + dx, yMin); sh.absarc(cz, cy, r, a0, Math.PI - a0, false); sh.lineTo(zMin, yMin);
  const g = new THREE.ExtrudeGeometry(sh, { depth: t, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 2, curveSegments: 28 });
  g.rotateY(-Math.PI / 2); g.translate(xc + t / 2, 0, 0);
  return shadowed(new THREE.Mesh(g, Y));
}
// Roue (axe local = x, face extérieure vers sx)
function makeWheel(sx) {
  const g = new THREE.Group();
  const prof = [[.27,-.16],[.36,-.16],[.405,-.135],[.425,-.08],[.425,.08],[.405,.135],[.36,.16],[.27,.16]].map(p => new THREE.Vector2(p[0], p[1]));
  const tire = new THREE.Mesh(new THREE.LatheGeometry(prof, 48), M.tire); tire.material.side = THREE.DoubleSide; g.add(tire);
  // sculptures de bande de roulement
  for (let i = 0; i < 36; i++) {
    const a = i / 36 * Math.PI * 2;
    const b = box(.03, .26, .03, M.tire, Math.sin(a) * .42, 0, Math.cos(a) * .42, .008); b.rotation.y = a; g.add(b);
  }
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(.275, .275, .3, 40, 1, true), M.rim); barrel.material.side = THREE.DoubleSide; g.add(barrel);
  const face = new THREE.Mesh(new THREE.CylinderGeometry(.255, .255, .04, 40), M.darker); face.position.y = .13; g.add(face);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(.27, .02, 10, 48), M.rim); lip.rotation.x = Math.PI / 2; lip.position.y = .15; g.add(lip);
  for (let i = 0; i < 5; i++) {   // 5 branches : la boucle de rotation reste sans saut
    const a = i / 5 * Math.PI * 2;
    const sp = box(.075, .05, .24, M.rim, Math.sin(a) * .15, .16, Math.cos(a) * .15, .02); sp.rotation.y = a; g.add(sp);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(.075, .075, .07, 24), M.rim); hub.position.y = .17; g.add(hub);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(.2, .2, .025, 36), M.dark); disc.position.y = -.05; g.add(disc);
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  g.rotation.z = -sx * Math.PI / 2;
  return g;
}

/* ============================================================
   Nœud articulé : pivot (repère voiture), pistes d'animation
   Chaque piste = delta d'un canal, une fenêtre [a,b] de la
   transformation (0→1) et une courbe d'accélération.
   La pose « voiture » = tous deltas nuls ; « robot » = somme.
   ============================================================ */
const root = new THREE.Group(); scene.add(root);
const rig = new THREE.Group(); rig.position.z = -0.35; root.add(rig);
const ALL = [];
const spinNodes = [];
class Node {
  constructor(name, parent, pivot) {
    this.name = name; this.parent = parent;
    this.pivot = new THREE.Vector3(...pivot);
    this.base = parent ? this.pivot.clone().sub(parent.pivot) : this.pivot.clone();
    this.g = new THREE.Group(); this.g.name = name; this.g.position.copy(this.base);
    (parent ? parent.g : rig).add(this.g);
    this.tracks = []; ALL.push(this);
  }
  add(...ms) { for (const m of ms) { m.position.sub(this.pivot); this.g.add(m); } return this; }
  T(ch, d, a, b, e = 'io') { this.tracks.push({ ch, d, a, b, f: E[e] }); return this; }
  pose(u) {
    const v = { px: 0, py: 0, pz: 0, rx: 0, ry: 0, rz: 0 };
    for (const t of this.tracks) v[t.ch] += t.d * t.f(clamp((u - t.a) / (t.b - t.a)));
    this.g.position.set(this.base.x + v.px, this.base.y + v.py, this.base.z + v.pz);
    this.g.rotation.set(v.rx * D2R, v.ry * D2R, v.rz * D2R);
  }
}

/* ============================================================
   Construction des pièces
   ============================================================ */
const ST = 0.36;                                     // axe des bandes noires (x = ±0.36)
const stripe = (s, y, z, len) => box(.17, .012, len, K, s * ST, y, z, .004);

// --- Bassin (moyeu central)
const pelvis = new Node('pelvis', null, [0, HIP_CAR_Y, .95]);
pelvis.add(box(1.3, .36, .4, DK, 0, .75, .95, .06), box(.5, .22, .5, DD, 0, .6, .95, .05));
// --- Torse
const torso = new Node('torso', pelvis, [0, .75, .95]);
torso.add(box(1.1, .6, 1.75, DK, 0, .56, .075, .06),
          box(.8, .1, 1.3, DD, 0, .88, .15, .03),
          cyl(.13, .62, 'z', DK, 0, .68, -1.12));            // cou télescopique
{ const rg = box(1.3, .03, .355, GL, 0, 1.185, -.85, .01); rg.rotation.x = -32.3 * D2R; torso.add(rg); } // lunette AR → collerette
// --- Pare-brise (se rabat pour devenir le ventre vitré)
const WS_ANG = Math.atan2(.31, .45);
const windshield = new Node('windshield', torso, [0, .97, .95]);
{ const g = box(1.5, .03, .546, GL, 0, 1.125, .725, .01); g.rotation.x = WS_ANG; windshield.add(g);
  for (const s of [-1, 1]) { const p = box(.05, .045, .546, DD, s * .76, 1.125, .725, .015); p.rotation.x = WS_ANG; windshield.add(p); } }
windshield.T('rx', -WS_ANG / D2R, .50, .74);
// --- Habitacle : toit en deux moitiés (pectoraux) + vitres latérales, coulisse vers le bas
const cabin = new Node('cabin', torso, [0, 1.3, -.1]);
for (const s of [-1, 1]) {
  cabin.add(box(.8, .06, 1.2, Y, s * .43, 1.3, -.1, .025), stripe(s, 1.336, -.1, 1.2),
            box(.03, .3, 1.1, GL, s * .82, 1.12, -.1, .01));
}
cabin.T('py', -.38, .58, .82);
// --- Tête (cachée sous le coffre, révélée puis télescopée)
const head = new Node('head', torso, [0, .68, -1.45]);
head.add(box(.56, .48, .56, Y, 0, .68, -1.45, .08),
         box(.4, .05, .36, DD, 0, .93, -1.45, .02),
         box(.14, .022, .06, M.eye, -.1, .955, -1.5, .008), box(.14, .022, .06, M.eye, .1, .955, -1.5, .008),
         box(.22, .02, .09, M.rim, 0, .955, -1.4, .008),
         cyl(.11, .08, 'x', DK, -.31, .68, -1.45), cyl(.11, .08, 'x', DK, .31, .68, -1.45));
for (const s of [-1, 1]) { const h = box(.05, .05, .24, Y, s * .19, .7, -1.8, .02); h.rotation.x = -.18; head.add(h); }
head.T('pz', -.15, .62, .92);
// --- Ailes (capot de coffre en deux moitiés + demi-pare-chocs AR + feux + échappements)
const wings = {};
for (const s of [-1, 1]) {
  const w = new Node('wing' + s, torso, [s * .9, 1.03, -1.0]);
  w.add(box(.85, .06, 1.15, Y, s * .475, 1.03, -1.575, .025), stripe(s, 1.036 + .003, -1.575, 1.15),
        box(.88, .36, .2, Y, s * .46, .82, -2.25, .04),
        box(.26, .1, .05, M.tail, s * .68, .9, -2.355, .01),
        cyl(.06, .18, 'z', M.rim, s * .28, .62, -2.33, 20),
        box(.1, .12, .1, DD, s * .46, .95, -2.1, .02));
  w.T('py', .5, 0, .17).T('rz', s * 100, .1, .46, 'ob').T('rx', -48, .22, .52, 'ob');
  wings[s] = w;
}
// --- Roues arrière + aile arrière (glissent vers l'épaule)
for (const s of [-1, 1]) {
  const wa = new Node('rwa' + s, torso, [s * .9, WHEEL_R, -1.3]);
  wa.add(archPlate(-2.0, -.7, .3, .98, -1.3, WHEEL_R, .48, s * .93, .04),
         cyl(.06, .3, 'x', DK, s * .75, WHEEL_R, -1.3, 16));
  wa.T('px', s * .3, 0, .22).T('pz', .65, .3, .64);
  const sp = new Node('rw' + s, wa, [s * .9, WHEEL_R, -1.3]);
  const wm = makeWheel(s); wm.position.set(s * .9, WHEEL_R, -1.3); sp.add(wm);
  spinNodes.push(sp);
}
// --- Bras : épaule → bras → avant-bras (porte = plaque extérieure du bras)
const arms = {}, forearms = {};
for (const s of [-1, 1]) {
  torso.add(cyl(.15, .34, 'x', DK, s * .76, .66, -.8), box(.14, .2, .28, DK, s * .62, .62, -.8, .04));
  const ua = new Node('arm' + s, torso, [s * .78, .53, -.8]);
  ua.g.rotation.order = 'YXZ';
  ua.add(box(.26, .26, 1.0, DK, s * .78, .66, -.3, .05), cyl(.15, .3, 'x', DK, s * .78, .53, .2),
         box(.04, .62, 1.0, Y, s * .94, .6, -.1, .015),                                   // porte
         box(.1, .08, .16, Y, s * 1.0, .94, .32, .03), box(.06, .06, .1, DD, s * .96, .9, .28, .02)); // rétroviseur
  const fa = new Node('fore' + s, ua, [s * .78, .53, .2]);
  fa.add(box(.26, .24, .62, DK, s * .78, .4, -.11, .05), box(.3, .28, .32, DD, s * .78, .4, -.64, .06),
         box(.04, .1, .5, Y, s * .93, .4, -.15, .015));
  fa.T('rx', -180, .38, .86, 'ob');
  arms[s] = ua; forearms[s] = fa;
}
// --- Jambes : cuisse (capot) → tibia (aile avant + roue) → pied
const thighs = {}, shins = {}, feet = {};
for (const s of [-1, 1]) {
  pelvis.add(cyl(.19, .44, 'x', DK, s * .47, HIP_CAR_Y, .95),
             box(.04, .6, .6, Y, s * .94, .6, .72, .015), box(.26, .12, .3, DK, s * .78, .62, .72, .03));
  const th = new Node('thigh' + s, pelvis, [s * .47, HIP_CAR_Y, .95]);
  th.add(box(.4, .26, 1.15, DK, s * .47, .75, 1.525, .05),
         box(.85, .07, 1.25, Y, s * .455, .965, 1.575, .03), stripe(s, 1.0 + .004, 1.575, 1.25),     // moitié de capot
         box(.1, .06, .3, DD, s * .455, .905, 1.2, .015), box(.1, .06, .3, DD, s * .455, .905, 1.9, .015),
         box(.85, .5, .2, Y, s * .455, .62, 2.3, .05),                                                    // demi pare-chocs avant
         box(.24, .13, .06, M.lamp, s * .7, .8, 2.405, .02), box(.5, .14, .04, DD, s * .4, .5, 2.405, .015),
         cyl(.15, .46, 'x', DK, s * .47, .595, 2.1),
         cyl(.03, .8, 'z', M.rim, s * .24, .64, 1.55, 14));
  th.T('rx', 90, .14, .62);
  const sh = new Node('shin' + s, th, [s * .47, .595, 2.1]);
  sh.add(box(.34, .26, 1.15, DK, s * .47, .44, 1.525, .05), cyl(.14, .44, 'x', DK, s * .47, .44, .95),
         archPlate(1.0, 2.2, .3, .98, 1.5, WHEEL_R, .48, s * .93, .04),
         cyl(.06, .3, 'x', DK, s * .75, WHEEL_R, 1.5, 16));
  sh.T('rx', -180, .42, 1.0, 'ob');
  const wsp = new Node('fw' + s, sh, [s * .9, WHEEL_R, 1.5]);
  const wm = makeWheel(s); wm.position.set(s * .9, WHEEL_R, 1.5); wsp.add(wm);
  spinNodes.push(wsp);
  const ft = new Node('foot' + s, sh, [s * .47, HIP_CAR_Y, .95]);
  ft.add(box(.4, .2, .62, DK, s * .47, .15, 1.25, .05), box(.38, .06, .32, Y, s * .47, .27, 1.4, .02),
         box(.36, .05, .14, DD, s * .47, .075, 1.05, .015));
  ft.T('rx', 90, .42, 1.0, 'ob');
  thighs[s] = th; shins[s] = sh; feet[s] = ft;
}
// --- Translation globale : le bassin monte à la hauteur du robot
pelvis.T('py', STAND_HIP - HIP_CAR_Y, .10, .74);
torso.T('rx', 90, .14, .66);

/* ============================================================
   Marche (cinématique inverse 2 segments, pieds plantés)
   ============================================================ */
const STEPS = [
  { f: 1,  a: .10, b: .95, z0: 0, z1: A },       // pas 1 : droit
  { f: -1, a: 1.0, b: 1.85, z0: 0, z1: 2 * A },  // pas 2 : gauche (double longueur, il dépasse)
  { f: 1,  a: 1.9, b: 2.75, z0: A, z1: 2 * A },  // pas 3 : droit rejoint
];
function footState(f, tw) {
  let last = 0;
  for (const s of STEPS) {
    if (s.f !== f) continue;
    if (tw < s.a) return { z: s.z0, lift: 0, pitch: 0 };
    if (tw < s.b) {
      const x = (tw - s.a) / (s.b - s.a);
      const pitch = (x < .35 ? -.3 * Math.sin(Math.PI * x / .35) : 0) + (x > .55 ? .14 * Math.sin(Math.PI * (x - .55) / .45) : 0);
      return { z: s.z0 + (s.z1 - s.z0) * sstep(x), lift: .42 * Math.pow(Math.sin(Math.PI * x), .6), pitch };
    }
    last = s.z1;
  }
  return { z: last, lift: 0, pitch: 0 };
}
function hipZ(tw) {                       // moyenne des pieds, lissée : déplacement continu du bassin
  let acc = 0, wsum = 0;
  for (let i = -4; i <= 4; i++) {
    const w = 5 - Math.abs(i), tt = clamp(tw + i * .05, 0, 3);
    acc += w * .5 * (footState(1, tt).z + footState(-1, tt).z); wsum += w;
  }
  return acc / wsum;
}
function ik(dz, dy) {                     // renvoie angle de cuisse (avant +) et flexion de genou
  let L = Math.hypot(dz, dy); L = clamp(L, .4, L1 + L2 - 1e-4);
  const phi = Math.PI - Math.acos(clamp((L1 * L1 + L2 * L2 - L * L) / (2 * L1 * L2), -1, 1));
  const alpha = Math.atan2(dz, -dy);
  const beta = Math.acos(clamp((L1 * L1 + L * L - L2 * L2) / (2 * L1 * L), -1, 1));
  return { a1: alpha + beta, phi };
}
function heroW(t) {
  if (t < 3.5 || t >= 4.25) return 0;
  if (t < 3.64) return E.ob((t - 3.5) / .14);
  if (t < 3.85) return 1;
  return 1 - sstep((t - 3.85) / .4);
}

/* ============================================================
   Chronologie 12 s → pose de tous les nœuds
   ============================================================ */

function timeline(t) {
  t = clamp(t, 0, LOOP);
  let u = 0;
  if (t < 1.5) u = 0; else if (t < 3.5) u = (t - 1.5) / 2; else if (t < 7) u = 1; else if (t < 9) u = 1 - (t - 7) / 2; else u = 0;
  let z = 0;
  if (t >= 4 && t < 7) z = hipZ(t - 4);
  else if (t >= 7 && t < 9) z = D;
  else if (t >= 9 && t < 11) z = D * (1 - E.io((t - 9) / 2));
  return { u, z };
}

const _v = new THREE.Vector3(), _bb = new THREE.Box3();
function lowestPoint() {           // plus bas sommet monde de toutes les pièces
  root.updateMatrixWorld(true); let m = 1e9;
  root.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry; if (!g.boundingBox) g.computeBoundingBox();
    _bb.copy(g.boundingBox).applyMatrix4(o.matrixWorld);
    if (_bb.min.y > m) return;
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) { _v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld); if (_v.y < m) m = _v.y; }
  });
  return m;
}
let lastInfo = {};
function applyTime(t) {
  const { u, z } = timeline(t);
  for (const n of ALL) n.pose(u);
  root.position.z = z;

  // --- Forme robot : marche, pose héroïque
  if (t >= 3.5 && t <= 7) {
    const tw = t - 4, hw = heroW(t);
    const w = Math.min(sstep(tw / .3), 1 - sstep((tw - 2.75) / .25));
    const zp = hipZ(clamp(tw, 0, 3));
    const phase = (tw - .525) / .9;
    const hipY = STAND_HIP - w * (.26 - .07 * Math.cos(2 * Math.PI * phase)) - .12 * hw;
    pelvis.g.position.y = pelvis.base.y + (hipY - HIP_CAR_Y);
    const a1 = {};
    for (const s of [-1, 1]) {
      const fs = footState(s, clamp(tw, -1, 3));
      const r = ik(fs.z - zp, ANKLE_H + fs.lift - hipY);
      a1[s] = r.a1;
      // fondu avec la pose de transformation aux bornes (continuité exacte à 3,5 s et 7 s)
      const k = Math.min(sstep((t - 3.5) / .12), 1 - sstep((t - 6.88) / .12));
      thighs[s].g.rotation.x = Math.PI / 2 + k * (-r.a1);
      shins[s].g.rotation.x = -Math.PI + k * r.phi;
      feet[s].g.rotation.x = Math.PI / 2 + k * ((r.a1 - r.phi) - fs.pitch);
    }
    for (const s of [-1, 1]) {
      const ash = 1.25 * a1[-s] * w + .22 * hw;
      const e = clamp(w * (.45 + 1.1 * Math.max(0, ash)) + 1.15 * hw, 0, 1.7);
      arms[s].g.rotation.set(-ash, s * (.1 * w + .38 * hw), 0);
      forearms[s].g.rotation.x = -Math.PI - e;
    }
    torso.g.rotation.set(Math.PI / 2 + .05 * w - .1 * hw, 0, .35 * w * (a1[1] - a1[-1]));
    head.g.rotation.z = (t > 3.55 && t < 4.6) ? .5 * Math.sin((t - 3.55) * 3.2) * (1 - sstep((t - 3.9) / .7)) : 0;
  }

  // --- Rotation des roues : seulement quand la voiture roule (retour 9→11 s, marche arrière)
  const spin = t >= 9 ? (z - D) / WHEEL_R : 0;
  for (const n of spinNodes) n.g.rotation.x = spin;

  // garde-fou : aucune pièce ne traverse le sol (relève la pose si besoin, jamais l'inverse)
  root.position.y = 0;
  const low = lowestPoint();
  if (low < -0.001) root.position.y = Math.min(-low, 0.4);
  lastInfo = { t, u, z, lift: root.position.y };
  return lastInfo;
}

/* ============================================================
   Interface & boucle
   ============================================================ */
let T = 0, playing = true, speed = 1, dragging = false;
const $ = id => document.getElementById(id);
const slider = $('time'), tlabel = $('tlabel'), phaseEl = $('phase');
const fmt = x => x.toFixed(2).replace('.', ',');

function phaseName(t) {
  if (t < 1.5) return 'Présentation';
  if (t < 3.5) return 'Voiture → Robot';
  if (t < 4) return 'Pose héroïque';
  if (t < 7) return 'Marche';
  if (t < 9) return 'Robot → Voiture';
  if (t < 11) return 'Retour';
  return 'Présentation';
}
function setPlaying(p) { playing = p; $('play').textContent = p ? '⏸' : '▶'; }
function setSpeed(s) { speed = s; $('s1').classList.toggle('on', s === 1); $('s025').classList.toggle('on', s !== 1); }
function setT(t) { T = clamp(t, 0, LOOP); }
$('play').onclick = () => setPlaying(!playing);
$('restart').onclick = () => { setT(0); setPlaying(true); };
$('s1').onclick = () => setSpeed(1);
$('s025').onclick = () => setSpeed(0.25);
$('bcar').onclick = () => { setT(0.75); setPlaying(false); };
$('brobot').onclick = () => { setT(3.75); setPlaying(false); };
slider.addEventListener('pointerdown', () => { dragging = true; });
addEventListener('pointerup', () => { dragging = false; });
slider.addEventListener('input', () => { setT(parseFloat(slider.value)); });

let camTween = null;
function resetCamera() {
  camTween = { t0: performance.now(), dur: 700, p0: camera.position.clone(), g0: controls.target.clone() };
}
$('bcam').onclick = resetCamera;
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'r' || e.key === 'R') $('restart').click();
  else if (e.key === 'v' || e.key === 'V') $('bcar').click();
  else if (e.key === 'b' || e.key === 'B') $('brobot').click();
  else if (e.key === 'c' || e.key === 'C') resetCamera();
  else if (e.key === 'ArrowRight') { setT(T + 0.1); }
  else if (e.key === 'ArrowLeft') { setT(T - 0.1); }
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 1.5 ? 32 * Math.min(1.9, 1.5 / (w / h)) : 32;   // cadrage 16:9 conservé sur écrans plus étroits
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let prev = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - prev) / 1000, 1.0); prev = now;   // temps réel : indépendant des FPS (seul un onglet gelé est plafonné)
  if (playing && !dragging) { T += dt * speed; if (T >= LOOP) T -= LOOP; }
  if (camTween) {
    const k = E.io(clamp((now - camTween.t0) / camTween.dur));
    camera.position.lerpVectors(camTween.p0, HOME_POS, k);
    controls.target.lerpVectors(camTween.g0, HOME_TGT, k);
    if (k >= 1) camTween = null;
  }
  applyTime(T);
  if (!dragging) slider.value = T;
  tlabel.textContent = `${fmt(T)} / 12 s`;
  phaseEl.textContent = phaseName(T);
  controls.update();
  renderer.render(scene, camera);
});

/* Crochets de test / inspection (console) */
window.__car = {
  setT: t => { setPlaying(false); setT(t); applyTime(T); },
  timeline, applyTime, ALL, root, camera, renderer, scene, THREE, controls,
  minY: lowestPoint,
};
</script>
</body>
</html>
