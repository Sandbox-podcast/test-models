<body><canvas id="scene" aria-label="Voiture jaune se transformant en robot, scène 3D interactive"></canvas><header><h1>Jaeger.</h1><p>Étude de transformation mécanique</p></header><div class="badge"><i></i><span id="phase">Voiture</span></div><p class="hint">Glisser pour orbiter · Molette pour zoomer</p><footer><div class="row"><button id="play">Pause</button><button id="restart" title="Recommencer le cycle">↺ Rejouer</button><select id="speed" aria-label="Vitesse"><option value="1">Vitesse normale · 1×</option><option value="0.25">Ralenti · 0,25×</option></select><div class="spacer"></div><button id="car">Voiture</button><button id="robot">Robot</button><button id="camera">↗ Vue initiale</button></div><div class="timeline"><input id="seek" type="range" min="0" max="12" step="0.001" value="0" aria-label="Temps du cycle en secondes"><output id="time">00.00 / 12 s</output></div><div class="phases"><span>Présentation</span><span>Déploiement</span><span>Marche</span><span>Repli</span><span>Retour</span></div></footer><div id="error">Le chargement 3D a échoué. Vérifiez votre connexion au CDN.</div>

// A quiet circular studio marking, built entirely from geometry.

const root=group();const parts=[];const V=a=>new THREE.Vector3(...a);function articulated(car,robot,cr=[0,0,0],rr=[0,0,0],delay=0){let g=group(root);parts.push({g,car:V(car),robot:V(robot),cq:new THREE.Quaternion().setFromEuler(new THREE.Euler(...cr)),rq:new THREE.Quaternion().setFromEuler(new THREE.Euler(...rr)),delay});return g}
const chassis=articulated([0,.72,0],[0,2.7,0],[0,0,0],[Math.PI/2,0,0],.03);box(chassis,1.4,.28,3.6,metal);for(let s of [-1,1]){box(chassis,.1,.12,3.4,silver,s*.62,-.19,0);for(let z of [-1,0,1])box(chassis,.3,.18,.35,black,s*.52,0,z)}
// Hood halves carry their own black racing stripe and front light assembly.
for(let s of [-1,1]){let hood=articulated([s*.54,1.05,1.45],[s*.56,3.52,.29],[0,0,0],[Math.PI*.42,0,s*-.12],s<0?.05:0);box(hood,1.05,.24,1.72,yellow);box(hood,.24,.012,1.69,black,s*-.17,.128,0,.005);box(hood,1.02,.33,.16,yellow,0,-.13,.83);box(hood,.7,.11,.06,black,0,-.14,.925);box(hood,.28,.055,.025,white,s*.28,-.09,.963,.009);for(let j=0;j<4;j++)box(hood,.035,.12,.03,silver,-.18+j*.11,-.16,.963,.005);box(hood,.06,.025,.6,metal,s*.35,.135,-.15,.008)}
// The complete glazed canopy pivots onto the back, without being removed.
const cabin=articulated([0,1.15,-.13],[0,3.46,-.63],[0,0,0],[1.72,0,0],.1);box(cabin,1.77,.12,1.25,yellow,0,.65,-.12);for(let s of [-1,1]){box(cabin,.24,.014,1.23,black,s*.36,.718,-.12,.005);let pillar=box(cabin,.09,.68,.09,yellow,s*.84,.32,.5);pillar.rotation.x=-.48;let side=box(cabin,.035,.48,1.04,glass,s*.855,.32,-.08);let p2=box(cabin,.09,.6,.09,yellow,s*.84,.32,-.7);p2.rotation.x=.3}let wind=box(cabin,1.58,.055,.74,glass,0,.32,.64);wind.rotation.x=1.0;let rearwind=box(cabin,1.58,.05,.61,glass,0,.32,-.83);rearwind.rotation.x=-1.13;
const head=articulated([0,.95,-.35],[0,4.34,.04],[Math.PI/2,0,0],[0,0,0],.22);box(head,.55,.58,.48,metal);box(head,.6,.18,.51,yellow,0,.24,0);box(head,.16,.36,.54,yellow,0,.05,0);for(let s of [-1,1]){box(head,.09,.36,.46,yellow,s*.28,0,0);box(head,.17,.075,.05,blue,s*.145,.07,.254,.012)}box(head,.35,.18,.08,silver,0,-.16,.255);for(let x of [-.1,0,.1])box(head,.025,.11,.025,black,x,-.16,.303,.005);
const wheelSpins=[];function wheel(p,x,y,z){let g=group(p);g.position.set(x,y,z);let spin=group(g);wheelSpins.push(spin);let tire=mesh(new THREE.TorusGeometry(.405,.135,12,40),rubber,spin);tire.rotation.y=Math.PI/2;let rim=cyl(spin,.31,.23,silver);rim.rotation.z=Math.PI/2;let hub=cyl(spin,.13,.27,metal);hub.rotation.z=Math.PI/2;for(let i=0;i<5;i++){let a=i*Math.PI*2/5;let spoke=box(spin,.255,.055,.49,silver);spoke.rotation.x=a}for(let side of [-1,1]){let disc=mesh(new THREE.TorusGeometry(.285,.018,6,32),silver,spin,side*.13);disc.rotation.y=Math.PI/2}return g}
const arms=[];for(let s of [-1,1]){const shoulder=articulated([s*1.04,.77,1.35],[s*1.04,3.65,0],[0,0,0],[0,0,-s*.15],.02);wheel(shoulder,s*.13,-.12,0);box(shoulder,.42,.23,1.15,yellow,0,.23,0);ball(shoulder,.19,0,-.15,0);const upper=group(shoulder);upper.position.set(0,-.15,0);box(upper,.28,.62,.32,metal,0,-.3,0);cyl(upper,.1,.62,silver,s*.14,-.3,0);let fore=group(upper);fore.position.y=-.61;ball(fore,.17,0,0,0);box(fore,.38,.61,.4,yellow,0,-.32,0);box(fore,.18,.46,.035,black,0,-.31,.215);box(fore,.29,.24,.3,metal,0,-.76,0);for(let j=0;j<3;j++)box(fore,.065,.17,.09,silver,(j-1)*.085,-.8,.18);arms.push({s,upper,fore});const door=articulated([s*1.05,1.02,-.25],[s*.92,3.48,-.35],[0,0,0],[0,s*.55,-s*.55],.12);box(door,.13,.46,1.48,yellow);box(door,.035,.04,.19,silver,s*.082,.1,-.4);box(door,.18,.11,.24,yellow,s*.15,.22,.5)}
// Hip, knee and ankle chains: all cylinders and armour remain present in both forms.
const pelvis=articulated([0,.65,-.8],[0,2.36,0],[0,0,0],[0,0,0],.02);box(pelvis,1.05,.4,.62,metal);box(pelvis,.58,.27,.08,yellow,0,0,.36);
const legs=[];for(let s of [-1,1]){let thigh=group(root),shin=group(root),foot=group(root);box(thigh,.36,1.04,.4,metal,0,-.52,0);for(let x of [-.18,.18])cyl(thigh,.065,.84,silver,x,-.5,.05);ball(thigh,.21,0,0,0);box(shin,.56,.78,.56,yellow,0,-.5,-.07);box(shin,.24,.71,.018,black,0,-.49,.22,.005);ball(shin,.2,0,0,0);let rearWheel=group(root);wheel(rearWheel,0,0,0);box(foot,.7,.25,1.05,yellow,0,.125,.16);box(foot,.24,.012,1,black,0,.256,.16,.005);box(foot,.64,.16,.14,black,0,.12,.69);box(foot,.47,.07,.025,red,0,.15,-.382,.009);legs.push({s,thigh,shin,foot,rearWheel})}
const smooth=x=>{x=THREE.MathUtils.clamp(x,0,1);return x*x*(3-2*x)};const lerp=THREE.MathUtils.lerp;

// Three one-second strides. Each stance foot has a constant world-space target.
function footTarget(s,t){let z=0,y=0;for(let i=0;i<3;i++){if((i%2===0?1:-1)!==s)continue;let u=THREE.MathUtils.clamp(t-i,0,1);let start=i===2?.9:0;let end=i===0?.9:i===1?1.35:1.8;z=lerp(start,end,smooth(u));if(u>0&&u<1)y=.28*Math.sin(Math.PI*u)}return new THREE.Vector3(s*.48,y,z)}

let time=0,playing=true,rate=1,last=performance.now();function pause(v){playing=!v;$('play').textContent=playing?'Pause':'Lecture'}$('play').onclick=()=>pause(playing);$('restart').onclick=()=>{time=0;pause(false)};$('speed').onchange=e=>rate=+e.target.value;$('seek').oninput=e=>{time=+e.target.value;pause(true);evaluate(time)};$('car').onclick=()=>{time=0;pause(true);evaluate(time)};$('robot').onclick=()=>{time=3.8;pause(true);evaluate(time)};$('camera').onclick=resetCamera;
