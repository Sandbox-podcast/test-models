<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YELLOW / SHIFT</title><style>*{box-sizing:border-box}body{margin:0;background:#17191b;color:#eee;font:12px system-ui;overflow:hidden}canvas{display:block}.brand{position:absolute;top:28px;left:32px;pointer-events:none;letter-spacing:.22em;font-weight:800;font-size:14px}.brand span{color:#ffc400}.sub{font-size:9px;letter-spacing:.18em;color:#a5a7a8;margin-top:8px}.panel{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(720px,94vw);background:#17191cdd;border:1px solid #ffffff26;border-radius:12px;padding:14px 18px;backdrop-filter:blur(12px)}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}button{background:#303235;color:#eee;border:1px solid #ffffff20;border-radius:5px;padding:8px 11px;cursor:pointer;font:inherit}button:hover,button.active{background:#ffc400;color:#181818}.time{font-variant-numeric:tabular-nums;color:#ffc400;margin-left:auto}input{width:100%;accent-color:#ffc400;margin:13px 0 4px}.hint{position:absolute;right:30px;top:30px;color:#aaa;letter-spacing:.08em;font-size:10px}</style></head><body><div class="brand"><span>YELLOW</span> / SHIFT<div class="sub">MÉCANIQUE EN MOUVEMENT · 01 / 12</div></div><div class="hint">GLISSER POUR ORBITER · MOLETTE POUR ZOOMER</div><div class="panel"><div class="row"><button id="play">❚❚ Pause</button><button id="restart">↺ Recommencer</button><button id="normal" class="active">1×</button><button id="slow">0,25×</button><button id="car">Voiture</button><button id="robot">Robot</button><button id="camera">⌖ Caméra</button><span class="time" id="time">0.00 / 12 s</span></div><input id="seek" type="range" min="0" max="12" step="0.01" value="0" aria-label="Temps"></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new T.Scene();scene.background=new T.Color(0x242628);scene.fog=new T.Fog(0x242628,18,38);const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);const initial=new T.Vector3(7,5.2,9);camera.position.copy(initial);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.55,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2.03;controls.minDistance=5;controls.maxDistance=20;
scene.add(new T.HemisphereLight(0xffffff,0x454545,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(5,10,6);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-9,right:9,top:9,bottom:-9});light.shadow.bias=-.0002;scene.add(light);const fill=new T.DirectionalLight(0xffffff,1.5);fill.position.set(-6,5,-7);scene.add(fill);
const mat=(color,metalness=0,roughness=.4)=>new T.MeshStandardMaterial({color,metalness,roughness});const yellow=mat(0xffc400,.5,.26),black=mat(0x101214,.2,.38),metal=mat(0x454c50,.8,.3),rubber=mat(0x111315,.05,.8),glass=mat(0x18252b,.5,.2),silver=mat(0xa4afb4,.8,.23),blue=new T.MeshStandardMaterial({color:0x70dfff,emissive:0x159bdc,emissiveIntensity:2});const ground=new T.Mesh(new T.PlaneGeometry(200,200),mat(0x303234,0,.8));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const root=new T.Group();scene.add(root);const parts=[];function box(parent,w,h,d,m,x=0,y=0,z=0){let q=new T.Mesh(new T.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;parent.add(q);return q}function part(car,robot){let g=new T.Group();root.add(g);parts.push({g,car,robot});return g}function stripes(g,w,d,y){for(let x of [-.22,.22])box(g,.15,.025,d,black,x,y,0)}const wheels=[];function wheel(g,x,y,z){let hub=new T.Group();hub.position.set(x,y,z);g.add(hub);wheels.push(hub);let tire=new T.Mesh(new T.CylinderGeometry(.39,.39,.3,32),rubber);tire.rotation.z=Math.PI/2;hub.add(tire);let rim=new T.Mesh(new T.CylinderGeometry(.24,.24,.315,24),silver);rim.rotation.z=Math.PI/2;hub.add(rim);for(let i=0;i<6;i++){let a=i*Math.PI/3;box(hub,.325,.045,.045,metal,0,Math.sin(a)*.14,Math.cos(a)*.14)}return hub}

let chest=part([0,.72,1.05,0,0,0],[0,2.75,.18,-.32,0,0]);box(chest,1.72,.35,1.45,yellow);stripes(chest,1.7,1.4,.19);box(chest,1.48,.12,.08,black,0,-.05,.74);for(let x of [-.6,.6])box(chest,.32,.09,.06,blue,x,.08,.75);
let back=part([0,.72,-1.12,0,0,0],[0,2.45,-.48,.65,0,0]);box(back,1.72,.34,1.15,yellow);stripes(back,1.7,1.1,.18);box(back,1.48,.1,.07,black,0,-.05,-.59);
let roof=part([0,1.35,-.25,0,0,0],[0,2.95,-.52,1.15,0,0]);box(roof,1.48,.18,1.35,yellow);stripes(roof,1.4,1.3,.1);box(roof,1.35,.42,.05,glass,0,-.25,.64);box(roof,1.35,.35,.05,glass,0,-.22,-.64);
let core=part([0,.67,0,0,0,0],[0,2.05,0,0,0,0]);box(core,1.15,.45,1.35,metal);box(core,.9,.35,.55,black,0,.35,0);for(let x of [-.32,.32])box(core,.15,.22,.58,silver,x,.1,0);
let head=part([0,.75,0,0,0,0],[0,3.53,.02,0,0,0]);box(head,.47,.48,.42,metal);box(head,.36,.15,.09,black,0,.03,.23);for(let x of [-.1,.1])box(head,.13,.06,.03,blue,x,.04,.29);box(head,.2,.18,.05,silver,0,-.13,.24);box(head,.16,.12,.32,yellow,0,.29,0);
const limbs=[];for(let s of [-1,1]){let arm=part([s*.82,.8,0,0,0,0],[s*1.13,2.55,0,0,0,s*-.1]);box(arm,.32,.85,.35,metal,0,-.3,0);box(arm,.45,.5,.44,yellow,0,-.12,0);box(arm,.32,.28,.35,black,0,-.78,0);wheel(arm,s*.05,.12,0);limbs.push({g:arm,type:'arm',s});let leg=part([s*.48,.62,-.05,Math.PI/2,0,0],[s*.43,1.14,0,0,0,0]);box(leg,.48,.95,.48,metal,0,-.05,0);box(leg,.52,.55,.5,yellow,0,.08,.04);box(leg,.46,.35,.55,metal,0,-.65,.04);box(leg,.52,.19,.76,black,0,-1.02,.16);wheel(leg,s*.28,.35,0);limbs.push({g:leg,type:'leg',s})}
const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>{x=clamp(x);return x*x*(3-2*x)};let t=0,playing=true,speed=1,last=performance.now();const seek=document.querySelector('#seek'),time=document.querySelector('#time');function update(){let f=t<1.5?0:t<3.5?ease((t-1.5)/2):t<7?1:t<9?1-ease((t-7)/2):0;let travel=t<4?0:t<7?1.05*ease((t-4)/3):t<9?1.05:t<11?1.05*(1-ease((t-9)/2)):0;root.position.z=travel;for(const w of wheels)w.rotation.x=t>=9&&t<11?(1.05-travel)/.39:0;for(const p of parts){let a=p.car,b=p.robot;for(let i=0;i<3;i++)p.g.position.setComponent(i,T.MathUtils.lerp(a[i],b[i],f));p.g.rotation.set(...[3,4,5].map(i=>T.MathUtils.lerp(a[i],b[i],f)))}if(t>=4&&t<7){let phase=(t-4)*Math.PI*2/1.5, envelope=Math.sin(Math.PI*(t-4)/3);for(let l of limbs){let wave=Math.sin(phase+(l.s===1?0:Math.PI));l.g.rotation.x+=(l.type==='leg'?.42:-.45)*wave*envelope;if(l.type==='leg')l.g.position.y+=Math.max(0,wave)*.15*envelope}}time.textContent=t.toFixed(2)+' / 12 s';seek.value=t}
const play=document.querySelector('#play');function sync(){play.textContent=playing?'❚❚ Pause':'▶ Lecture'}play.onclick=()=>{playing=!playing;last=performance.now();sync()};document.querySelector('#restart').onclick=()=>{t=0;playing=true;last=performance.now();sync();update()};document.querySelector('#normal').onclick=()=>{speed=1;normal.classList.add('active');slow.classList.remove('active')};document.querySelector('#slow').onclick=()=>{speed=.25;slow.classList.add('active');normal.classList.remove('active')};seek.oninput=()=>{t=+seek.value;update()};function freeze(v){t=v;playing=false;sync();update()}document.querySelector('#car').onclick=()=>freeze(.5);document.querySelector('#robot').onclick=()=>freeze(3.75);document.querySelector('#camera').onclick=()=>{camera.position.copy(initial);controls.target.set(0,1.55,0);controls.update()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(now=>{let dt=Math.min((now-last)/1000,.1);last=now;if(playing){t=(t+dt*speed)%12}update();controls.update();renderer.render(scene,camera)});
