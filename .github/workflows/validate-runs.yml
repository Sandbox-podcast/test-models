name: Validation des essais

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-runs:
    name: Vérifier les fiches et empreintes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/validate_runs.py
